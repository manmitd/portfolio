<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>/*[|template_title|]*/0</title>
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<style>
@font-face { font-family: "Instrument Sans"; src: url("/assets/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Instrument Serif"; src: url("/assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "DM Mono"; src: url("/assets/fonts/dm-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Inter"; src: url("/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --navy: #112E4B; --dusty: #5277A0; --label: #4C6F96; --ink-soft: #3E5168; --rule: #E2E2DD; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  font-family: "Inter", system-ui, sans-serif; color: var(--navy); -webkit-font-smoothing: antialiased;
  background-color: #F6F7F9;
  background-image:
    linear-gradient(rgba(82,119,160,0.11) 1px, transparent 1px),
    linear-gradient(90deg, rgba(82,119,160,0.11) 1px, transparent 1px),
    linear-gradient(rgba(82,119,160,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(82,119,160,0.055) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  background-position: -1px -1px;
}
.hidden { display: none !important; }
.card { width: min(440px, 100%); padding: 40px 36px 36px; border-radius: 22px; background: #fff; border: 1px solid rgba(17,46,75,0.08);
  box-shadow: 0 2px 4px rgba(17,46,75,0.05), 0 24px 56px -20px rgba(17,46,75,0.28); }
.label { margin: 0 0 14px; font-family: "DM Mono", ui-monospace, monospace; font-weight: 500; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--label); }
h1 { margin: 0; font-family: "Instrument Sans", "Inter", sans-serif; font-weight: 500; font-size: 34px; line-height: 1.1; letter-spacing: -0.03em; }
h1 em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; color: var(--dusty); letter-spacing: -0.01em; }
.lede { margin: 12px 0 28px; font-size: 16px; line-height: 1.55; color: var(--ink-soft); }
label.field { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
.row { position: relative; }
input[type="password"], input[type="text"] {
  width: 100%; height: 52px; padding: 0 64px 0 16px; border: 1.5px solid #CBD5E0; border-radius: 12px; background: #fff;
  font: inherit; font-size: 17px; color: var(--navy);
}
input:focus { outline: none; border-color: var(--dusty); box-shadow: 0 0 0 4px rgba(82,119,160,0.2); }
input[aria-invalid="true"] { border-color: #B4472F; }
.show { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none;
  font-family: "DM Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); cursor: pointer; }
.show:hover { background: #EEF2F7; }
.error { min-height: 22px; margin: 10px 0 0; font-size: 14px; line-height: 1.4; color: #B4472F; }
.unlock { width: 100%; height: 52px; margin-top: 12px; border: 0; border-radius: 999px; background: var(--navy); color: #fff; cursor: pointer;
  font-family: "DM Mono", ui-monospace, monospace; font-weight: 500; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
.unlock:hover { background: #1B4168; }
.unlock[disabled] { opacity: 0.7; cursor: progress; }
:focus-visible { outline: 3px solid var(--dusty); outline-offset: 3px; }
.loading { font-family: "DM Mono", ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--label); }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise 0.4s cubic-bezier(.32,.72,0,1); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<p id="staticrypt_loading" class="loading" role="status">Opening…</p>

<main id="staticrypt_content" class="card hidden">
  <p class="label">Manmit Dhindsa</p>
  <h1>A <em>private</em> presentation</h1>
  <p class="lede">/*[|template_instructions|]*/0</p>
  <form id="staticrypt-form" action="#" method="post" novalidate>
    <label class="field" for="staticrypt-password">Password</label>
    <div class="row">
      <input id="staticrypt-password" type="password" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false"
        placeholder="/*[|template_placeholder|]*/0" aria-describedby="staticrypt-error" required>
      <button type="button" class="show" id="toggle" aria-pressed="false" aria-controls="staticrypt-password">Show</button>
    </div>
    <p class="error" id="staticrypt-error" role="alert" aria-live="assertive"></p>
    <button type="submit" class="unlock" id="unlock">/*[|template_button|]*/0</button>
  </form>
</main>

<script>
// Keep the unlock for this tab only: StatiCrypt's "remember" writes to localStorage,
// so point it at sessionStorage. Refresh stays unlocked; closing the tab locks it again.
try { Object.defineProperty(window, "localStorage", { configurable: true, get: function () { return window.sessionStorage; } }); } catch (e) {}

// Presenter window: some browsers don't copy this tab's session into a new window,
// so borrow the unlock from the window that opened it (same site only).
try {
  if (window.opener && window.opener.location.origin === location.origin) {
    ["deck_unlock", "deck_unlock_expiry"].forEach(function (k) {
      var v = window.opener.sessionStorage.getItem(k);
      if (v !== null && sessionStorage.getItem(k) === null) sessionStorage.setItem(k, v);
    });
  }
} catch (e) {}

const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
const templateError = "/*[|template_error|]*/0",
  isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
  staticryptConfig = /*[|staticrypt_config|]*/ 0;

const staticrypt = staticryptInitiator.init(staticryptConfig, {
  rememberExpirationKey: "deck_unlock_expiry",
  rememberPassphraseKey: "deck_unlock",
  replaceHtmlCallback: null,
  clearLocalStorageCallback: null
});

window.onload = async function () {
  const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
  if (!isSuccessful) {
    document.getElementById("staticrypt_loading").classList.add("hidden");
    document.getElementById("staticrypt_content").classList.remove("hidden");
    document.getElementById("staticrypt-password").focus();
  }
};

const input = document.getElementById("staticrypt-password");
const toggle = document.getElementById("toggle");
const error = document.getElementById("staticrypt-error");
const unlock = document.getElementById("unlock");

toggle.addEventListener("click", function () {
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  toggle.textContent = showing ? "Show" : "Hide";
  toggle.setAttribute("aria-pressed", String(!showing));
  input.focus();
});
input.addEventListener("input", function () { error.textContent = ""; input.removeAttribute("aria-invalid"); });

document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  if (!input.value) { error.textContent = "Enter the password to continue."; input.setAttribute("aria-invalid", "true"); input.focus(); return; }
  unlock.disabled = true;
  const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, true);
  if (!isSuccessful) {
    unlock.disabled = false;
    error.textContent = templateError;
    input.setAttribute("aria-invalid", "true");
    input.select();
  }
});
</script>
</body>
</html>
